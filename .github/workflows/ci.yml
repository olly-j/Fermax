name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install and require the plugin's FFmpeg binary
        run: |
          npm rebuild ffmpeg-for-homebridge
          node --eval 'const fs = require("node:fs"); const ffmpeg = require("ffmpeg-for-homebridge"); if (!ffmpeg || !fs.existsSync(ffmpeg)) throw new Error("Bundled FFmpeg is unavailable"); fs.appendFileSync(process.env.GITHUB_ENV, `FERMAX_TEST_FFMPEG=${ffmpeg}\n`);'
      - name: Verify
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check package contents
        run: npm pack --dry-run
